apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-api
  namespace: ai-observability
  annotations:
    eks.amazonaws.com/role-arn: REPLACED_BY_TERRAFORM_OUTPUT_AT_DEPLOY_TIME
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-api
  namespace: ai-observability
spec:
  selector:
    app.kubernetes.io/name: analytics-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-api
  namespace: ai-observability
  labels:
    app.kubernetes.io/name: analytics-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-api
    spec:
      serviceAccountName: analytics-api
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: analytics-api
          image: REPLACED_BY_IMMUTABLE_ECR_DIGEST_AT_DEPLOY_TIME
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AIOPS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: analytics-runtime
                  key: database-url
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: analytics-api
  namespace: ai-observability
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics-api
