# This is a contract for External Secrets Operator. Install that controller before this
# object is applied. The secret value is intentionally absent from this repository.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: analytics-runtime
  namespace: ai-observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: analytics-runtime
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: REPLACED_BY_TERRAFORM_RUNTIME_SECRET_NAME
        property: database-url
