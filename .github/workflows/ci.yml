name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - run: PYTHONPATH=analytics-api/src ruff check analytics-api/src tests
      - run: PYTHONPATH=analytics-api/src pytest -q
      - run: python -m json.tool dashboards/ai-platform-health.json >/dev/null
