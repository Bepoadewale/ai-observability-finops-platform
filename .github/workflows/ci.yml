name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - run: PYTHONPATH=analytics-api/src ruff check analytics-api/src tests
      - run: PYTHONPATH=analytics-api/src pytest -q
      - run: python -m json.tool dashboards/ai-platform-health.json >/dev/null

  local-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Build the project-local stack
        run: make bootstrap-local
      - name: Exercise live telemetry, FinOps, and recovery paths
        run: |
          make smoke
          make demo-local
          make demo-degradation
          make demo-cost-spike
          make demo-tool-bottleneck
          make demo-saturation
          make demo-dashboard
          make demo-recovery
          make verify
      - name: Capture project logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove project-local infrastructure
        if: always()
        run: make clean
