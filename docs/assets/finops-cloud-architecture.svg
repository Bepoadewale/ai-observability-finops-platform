<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Planned AI Observability and FinOps AWS pilot</title><desc id="desc">Private AWS pilot topology for telemetry collection, correlation, dashboards, and estimated cost analysis.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:28px;font-weight:bold}.s{font-size:16px;fill:#475569}.g{font-size:17px;font-weight:bold}.c{font-size:16px;font-weight:bold}.d{font-size:13px;fill:#475569}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.aws{fill:#fff7ed;stroke:#f97316;stroke-width:2}.line{stroke:#64748b;stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 8,4 0,8z" fill="#64748b"/></marker></defs>
  <rect width="1400" height="720" fill="#fff"/><text x="55" y="55" class="h">AI Observability + FinOps — planned AWS pilot</text><text x="55" y="84" class="s">Design only: private telemetry and analysis; no AWS runtime has been executed.</text>
  <rect x="55" y="120" width="1290" height="510" rx="18" fill="#f8fafc" stroke="#cbd5e1"/><text x="80" y="152" class="g">AWS account / private VPC</text>
  <rect x="95" y="205" width="220" height="110" rx="10" class="box"/><text x="118" y="240" class="c">AI workload</text><text x="118" y="265" class="d">metadata-only telemetry</text><text x="118" y="286" class="d">private EKS Pod</text>
  <rect x="405" y="205" width="220" height="110" rx="10" class="aws"/><text x="428" y="240" class="c">OTel Collector</text><text x="428" y="265" class="d">traces and metrics</text><text x="428" y="286" class="d">private EKS Pod</text>
  <rect x="735" y="180" width="220" height="90" rx="10" class="aws"/><text x="758" y="215" class="c">Tempo + Prometheus</text><text x="758" y="240" class="d">private telemetry stores</text>
  <rect x="735" y="330" width="220" height="90" rx="10" class="aws"/><text x="758" y="365" class="c">Analytics API</text><text x="758" y="390" class="d">correlation, SLO, cost</text>
  <rect x="1040" y="180" width="220" height="90" rx="10" class="aws"/><text x="1063" y="215" class="c">Grafana</text><text x="1063" y="240" class="d">private dashboard</text>
  <rect x="1040" y="330" width="220" height="90" rx="10" class="aws"/><text x="1063" y="365" class="c">RDS + S3</text><text x="1063" y="390" class="d">durable state/artifacts</text>
  <line x1="315" y1="260" x2="405" y2="260" class="line"/><line x1="625" y1="245" x2="735" y2="225" class="line"/><line x1="625" y1="275" x2="735" y2="370" class="line"/><line x1="955" y1="225" x2="1040" y2="225" class="line"/><line x1="955" y1="375" x2="1040" y2="375" class="line"/>
  <text x="95" y="570" class="s">Terraform will create and destroy only tagged pilot resources. Browser access, if needed, is limited to the dashboard/API path; data stores and administration stay private.</text>
</svg>
