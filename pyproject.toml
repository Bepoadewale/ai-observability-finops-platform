[project]
name = "ai-observability-finops-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "prometheus-client>=0.21,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
pythonpath = ["analytics-api/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"] # FastAPI dependency injection uses Depends() defaults.
