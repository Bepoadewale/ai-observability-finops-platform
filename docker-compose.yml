services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
    volumes: ["./platform/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./platform/prometheus/rules:/etc/prometheus/rules:ro"]
  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yml"]
    ports: ["3200:3200", "4317:4317"]
    volumes: ["./platform/tempo/tempo.yml:/etc/tempo.yml:ro"]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.134.1
    command: ["--config=/etc/otelcol/config.yaml"]
    ports: ["4318:4318"]
    volumes: ["./platform/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro"]
  grafana:
    image: grafana/grafana:12.1.0
    ports: ["3000:3000"]
    volumes: ["./platform/grafana/provisioning:/etc/grafana/provisioning:ro", "./dashboards:/var/lib/grafana/dashboards:ro"]
